name: esca_camview
description: ESCA camera viewer -- the camera live, with what the detector found drawn over it.
publish_to: none
version: 0.2.0

environment:
  sdk: ">=3.6.0 <4.0.0"

# dbus and ffi are pure Dart; the native half is libesca-camview-bridge,
# built by its own recipe from native/.
dependencies:
  flutter:
    sdk: flutter
  dbus: ^0.8.0
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  shaders:
    - shaders/i420.frag
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: fonts/BeVietnamPro-Regular.ttf
        - asset: fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: fonts/BeVietnamPro-Bold.ttf
          weight: 700
